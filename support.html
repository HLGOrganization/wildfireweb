<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赞助 & 加群 · 野火整合包</title>
<meta name="description" content="支持野火整合包，或加入 QQ 群一起玩、一起反馈问题。">
<meta name="theme-color" content="#12100f">
<link rel="icon" type="image/png" href="assets/img/icon.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/font/fusion-pixel-12px-proportional-zh_hans.ttf.woff2">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="support" data-title="赞助 & 加群">

<a class="skip-link" href="#main">跳到主要内容</a>

<header id="site-header"></header>

<main id="main">

  <!-- 赞助 -->
  <section class="section" id="donate">
    <div class="wrap">
      <div class="head">
        <span class="head__kicker">SUPPORT US</span>
        <h1 class="head__title">赞助支持</h1>
      </div>

      <div class="card mb-2">
        <div id="donate-intro" class="dim"></div>
      </div>

      <div id="donate-methods" class="pay-methods mb-2"></div>

      <div id="donate-note" class="mb-2"></div>

      <h3 class="mb-1">赞助者名单</h3>
      <p class="muted" style="font-size:13.5px">名单由我们手动维护，可能会有延迟。想匿名的话在留言里说一声就行。</p>
      <div id="sponsors"></div>
    </div>
  </section>

  <!-- 加群 -->
  <section class="section section--alt" id="qq">
    <div class="wrap">
      <div class="head">
        <span class="head__kicker">JOIN US</span>
        <h2 class="head__title">加入 QQ 群</h2>
        <p class="head__desc">
          群里可以：联机找人、反馈 Bug、要更新、看开服动态。
          进群后先看一眼群公告。
        </p>
      </div>

      <div id="qq-block"></div>
    </div>
  </section>

  <!-- 还能怎么帮 -->
  <section class="section">
    <div class="wrap">
      <div class="head">
        <span class="head__kicker">OTHER WAYS</span>
        <h2 class="head__title">不花钱也能帮到我们</h2>
      </div>
      <div class="quick">
        <div class="card quick__item">
          <span class="quick__icon" aria-hidden="true">🐛</span>
          <span class="quick__title">认真反馈问题</span>
          <span class="quick__desc">带上崩溃报告和复现步骤的反馈，比任何赞助都值钱。</span>
        </div>
        <div class="card quick__item">
          <span class="quick__icon" aria-hidden="true">📣</span>
          <span class="quick__title">推荐给朋友</span>
          <span class="quick__desc">在服务器里、在群里、在视频简介里提一句都算。</span>
        </div>
      </div>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<noscript>
  <div class="wrap" style="padding:20px 0">
    <div class="note note--warn">
      <span class="note__icon">⚠️</span>
      <div><strong>需要开启 JavaScript</strong>：群号与赞助信息由脚本渲染，请允许本站运行 JavaScript。</div>
    </div>
  </div>
</noscript>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
</body>
</html>
