<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新日志 · 野火整合包</title>
<meta name="description" content="野火整合包各版本更新日志：新增、修复、调整与移除的完整记录。">
<meta name="theme-color" content="#12100f">
<link rel="icon" type="image/png" href="assets/img/icon.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/font/fusion-pixel-12px-proportional-zh_hans.ttf.woff2">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="changelog" data-title="更新日志">

<a class="skip-link" href="#main">跳到主要内容</a>

<header id="site-header"></header>

<main id="main">

  <section class="section">
    <div class="wrap">
      <div class="head">
        <span class="head__kicker">CHANGELOG</span>
        <h1 class="head__title">更新日志</h1>
        <p class="head__desc">
          每次更新都会在这里写明改了什么。换版本前建议先看一眼，
          尤其是标了「移除」的条目 —— 那些模组里的机器和方块可能会消失。
        </p>
      </div>

      <div class="note mb-2">
        <span class="note__icon">💾</span>
        <div>
          <strong>升级前请务必备份存档。</strong>
          把整合包实例目录下的 <code>saves</code> 文件夹整体复制一份，出问题还能退回来。
        </div>
      </div>

      <div id="log-list"></div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap">
      <div class="head">
        <h2 class="head__title">想第一时间知道更新？</h2>
        <p class="head__desc">更新会先在 QQ 群公告同步，群里也能直接反馈问题。</p>
      </div>
      <div class="btn-row">
        <a class="btn btn--primary" href="support.html">加入 QQ 群</a>
        <a class="btn btn--ghost" href="downloads.html">去下载最新版</a>
      </div>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<noscript>
  <div class="wrap" style="padding:20px 0">
    <div class="note note--warn">
      <span class="note__icon">⚠️</span>
      <div><strong>需要开启 JavaScript</strong>：更新日志由脚本渲染，请允许本站运行 JavaScript。</div>
    </div>
  </div>
</noscript>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
